# ZeroDrop Reader - Standalone nginx config
# Serves reader.html at /reader.html and static assets at /static/*
# Files are copied to nginx root; /static/ is aliased to root.
# HTTPS (port 443) is the primary server for camera access.
# HTTP (port 80) redirects to HTTPS.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect HTTP to HTTPS (camera requires secure context)
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server with self-signed cert (generated at build time)
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/ssl/self-signed.crt;
        ssl_certificate_key /etc/nginx/ssl/self-signed.key;

        # Serve /static/* by aliasing to root (jsqr.min.js lives at root)
        location /static/ {
            alias /usr/share/nginx/html/;
        }

        # Serve reader.html at root
        location = /reader.html {
            root /usr/share/nginx/html/;
        }

        # Fallback: 404 for everything else
        location / {
            return 404;
        }
    }
}
