# ZeroDrop Terminal - Production Override
# Docker-only deployment. No reverse proxy, no external infrastructure.
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  zerodrop:
    restart: always
    environment:
      - PRINTER_TYPE=usb
      - PRINTER_DEVICE=/dev/usb/lp0
      - LOG_ENABLED=false
    # Map USB printer device (NOT privileged mode)
    devices:
      - /dev/usb/lp0:/dev/usb/lp0
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    volumes:
      - ./data:/app/data
    # USB device group permissions for printer access
    group_add:
      - dialout
      - lp
    # Security options
    security_opt:
      - no-new-privileges:true
