# ZeroDrop Terminal - Production Override
# Docker-only deployment. No reverse proxy, no external infrastructure.
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  zerodrop:
    restart: always
    environment:
      - PRINTER_TYPE=${PRINTER_TYPE:-usb}
      - PRINTER_DEVICE=${PRINTER_DEVICE:-}
      - LOG_ENABLED=false
    # Map USB printer device (NOT privileged mode)
    # Falls back to /dev/usb/lp0 if PRINTER_DEVICE is empty in .env
    devices:
      - "${PRINTER_DEVICE:-/dev/usb/lp0}:${PRINTER_DEVICE:-/dev/usb/lp0}"
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    volumes:
      - ./data:/app/data
    # USB device group permissions for printer access
    group_add:
      - dialout
      - lp
    # Security options
    security_opt:
      - no-new-privileges:true
