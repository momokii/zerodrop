# ZeroDrop Terminal - Production Override
# Docker-only deployment. No reverse proxy, no external infrastructure.
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  zerodrop:
    restart: always
    environment:
      - PRINTER_TYPE=${PRINTER_TYPE:-usb}
      - PRINTER_DEVICE=${PRINTER_DEVICE:-}
      - RATE_LIMIT_REQUESTS_PER_HOUR=${RATE_LIMIT_REQUESTS_PER_HOUR:-5}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-1}
      - LOG_ENABLED=${LOG_ENABLED:-false}
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - KEY_ROTATE=${KEY_ROTATE:-false}
    # USB printer access — handles both initial detection and re-enumeration:
    #   - device_cgroup_rules: grants kernel-level access to ALL USB devices (major 189)
    #     so re-enumerated devices (new devnum) are accessible without restart
    #   - /dev/bus/usb rshared mount: makes the entire USB bus visible inside container
    #   - /sys/bus/usb read-only mount: enables sysfs scanning for raw USB detection
    #   Note: No explicit devices: entry — the bind mount + cgroup rules cover all USB
    #     devices dynamically. This also means the container starts fine even when the
    #     printer is not connected (the app gracefully falls back to Mock Printer).
    device_cgroup_rules:
      - 'c 189:* rw'
    volumes:
      - ./data:/app/data
      - /sys/bus/usb:/sys/bus/usb:ro
      # Mount host USB device tree so re-enumerated devices are visible
      - /dev/bus/usb:/dev/bus/usb:rshared
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    group_add:
      - dialout
      - lp
    security_opt:
      - no-new-privileges:true
