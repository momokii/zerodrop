# ZeroDrop Terminal - Traefik Integration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d

version: '3.8'

services:
  zerodrop:
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"

      # Web entry point
      - "traefik.http.routers.zerodrop.rule=Host(`zerodrop.local`)"  # Change to your domain
      - "traefik.http.routers.zerodrop.entrypoints=websecure"
      - "traefik.http.routers.zerodrop.tls=true"

      # Rate limiting (5 requests per hour)
      - "traefik.http.routers.zerodrop.middlewares=rate-limit"
      - "traefik.http.middlewares.rate-limit.ratelimit.average=5"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1h"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=1"

      # Service definition
      - "traefik.http.services.zerodrop.loadbalancer.server.port=8080"

      # Health check
      - "traefik.http.services.zerodrop.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.zerodrop.loadbalancer.healthcheck.interval=30s"

  # Add Traefik service
  traefik:
    image: traefik:v2.10
    container_name: zerodrop-traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=zerodrop-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8080"  # Dashboard (localhost only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - zerodrop-net

networks:
  zerodrop-net:
    driver: bridge
