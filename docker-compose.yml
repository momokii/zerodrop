# ZeroDrop Terminal - Base Docker Compose Configuration
# This file contains environment-agnostic service definitions.
# Override files (override.yml, prod.yml) add environment-specific settings.

services:
  zerodrop:
    build:
      context: .
      dockerfile: Dockerfile
    image: zerodrop:latest
    container_name: zerodrop-terminal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PRINTER_TYPE=${PRINTER_TYPE:-mock}
      - PRINTER_DEVICE=${PRINTER_DEVICE:-}
      - PUBLIC_KEY_PATH=/app/data/public_key.pem
      - RATE_LIMIT_REQUESTS_PER_HOUR=${RATE_LIMIT_REQUESTS_PER_HOUR:-5}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-1}
      - LOG_ENABLED=${LOG_ENABLED:-false}
      - TLS_ENABLED=${TLS_ENABLED:-false}
    volumes:
      # Persist public key
      - ./data:/app/data
    networks:
      - zerodrop-net

networks:
  zerodrop-net:
    driver: bridge
