# Traefik Configuration for ZeroDrop Terminal
# Provides reverse proxy, rate limiting, and HTTPS termination

# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard configuration
api:
  dashboard: true
  insecure: false  # Dashboard only accessible via Traefik container

# Entry points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

# Log configuration
log:
  level: INFO  # DEBUG for development, INFO/WARN for production

# Docker provider
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
